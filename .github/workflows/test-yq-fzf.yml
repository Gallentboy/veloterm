# 目标（单一）：Go FFI 车道——veloterm_goffi.dll（yq + fzf 合并的 c-shared
# DLL，双符号 veloterm_yq_main / veloterm_fzf_main；cgo 需 gcc，GOAMD64=v3
# 以 AVX2 为基线）。经 build-tools.mjs --only goffi 产出（只依赖 Go）。
# 触发：推 tag（验证完删除）——
#   git tag test_goffi && git push origin test_goffi
#   git push origin :refs/tags/test_goffi
#   （test_yq / test_fzf 历史习惯 tag 同样触发本车道）
# 也支持 workflow_dispatch 手动触发。
name: 'test-yq-fzf'

on:
  workflow_dispatch:
  push:
    tags:
      - 'test_goffi*'
      - 'test_yq*'
      - 'test_fzf*'

jobs:
  build-go-ffi:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # cgo 需要 gcc：build-tools.mjs 会探测 PATH 与常见 MinGW 位置，
      # 这里直接确保 MSYS2 mingw64 gcc 在位（--needed 幂等，已装则秒过）
      - name: Install MSYS2 gcc for cgo (Windows)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -Sy --needed --noconfirm mingw-w64-x86_64-gcc"

      - name: Build veloterm_goffi.dll
        run: node scripts/build-tools.mjs --only goffi --target x86_64-pc-windows-msvc

      - name: Upload Go FFI artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-windows-x64
          path: src-tauri/binaries/veloterm_goffi.dll
          if-no-files-found: error
          retention-days: 7
