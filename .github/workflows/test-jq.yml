# 目标（单一）：coreutils.exe 全量构建产物——jq / bc / openssl / urlencode 等
# 随 cargo 编译的全部内置命令都在这个 exe 里，供真机验证（免装安装包，
# 下载后以子命令模式运行，如 `coreutils-...exe jq -n 1+1`）。
# 触发：推 tag（验证完删除）——
#   git tag test_jq && git push origin test_jq
#   git push origin :refs/tags/test_jq   # 验证完删 tag
# 也支持 workflow_dispatch 手动触发。全量出包门禁是 publish.yml（push release）。
name: 'test-jq'

on:
  workflow_dispatch:
  push:
    tags:
      - 'test_jq*'

jobs:
  build-coreutils:
    permissions:
      contents: read
      # vcpkg 二进制缓存推送/拉取 GitHub Packages（NuGet feed）
      packages: write
    runs-on: windows-latest
    env:
      USERNAME: Gallentboy
      FEED_URL: https://nuget.pkg.github.com/Gallentboy/index.json
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/Gallentboy/index.json,readwrite'
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # jq/bc/openssl 的 C 编译依赖与 publish.yml 相同（vcpkg OpenSSL 二进制缓存）
      - name: Add NuGet source for vcpkg binary cache (GitHub Packages)
        shell: pwsh
        run: |
          $vcpkgExe = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          $nuget = (& $vcpkgExe fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:FEED_URL"

      - name: Install OpenSSL for SQLCipher (Windows)
        working-directory: src-tauri
        shell: pwsh
        env:
          VCPKG_BUILD_TYPE: release
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT" } else { "C:\vcpkg" }
          git config --global --add safe.directory "$vcpkgRoot"
          git -C "$vcpkgRoot" fetch origin master
          if ($LASTEXITCODE -ne 0) { Write-Host "git fetch 补历史失败（exit $LASTEXITCODE），继续安装：当前镜像通常已含 baseline 历史" }
          vcpkg install "--x-install-root=$vcpkgRoot\installed"

      - name: Set OpenSSL env (Windows)
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT" } else { "C:\vcpkg" }
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build coreutils binary
        run: node scripts/build-tools.mjs --only coreutils --target x86_64-pc-windows-msvc

      # DLL lib/ 布局的运行期验证（coreutils.exe 作宿主，另建 goffi DLL）：
      # 搭出安装后的目录形状（tools\ 短名硬链接 + lib/ 放 DLL）执行 yq --version，
      # 覆盖 crate::dll_paths 的候选解析与 LoadLibrary。这是唯一真正执行 DLL
      # 加载路径的验证（cargo test 只覆盖纯函数，且 Windows 车道不跑 cargo test）。
      # 断言见脚本头注释（含平铺兜底与 DLL 缺失诊断）。放本车道是因为这里已有
      # coreutils.exe 与 OpenSSL；goffi 段只需 Go + gcc（几步安装，比另起车道省）。
      - name: Install Go + MSYS2 gcc for goffi DLL
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -Sy --needed --noconfirm mingw-w64-x86_64-gcc"

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build veloterm_goffi.dll (host-side DLL for layout verification)
        run: node scripts/build-tools.mjs --only goffi --target x86_64-pc-windows-msvc

      - name: Verify DLL lib/ layout at runtime
        shell: pwsh
        run: |
          # -VersionArg 的值必须加引号：PowerShell 把裸 `--version` 当参数名
          # 解析（前缀 - 即参数），-VersionArg 会拿不到值并报
          # "Missing an argument for parameter 'VersionArg'"（CI 实测）。
          pwsh -NoProfile -File scripts/verify-dll-layout.ps1 `
            -Coreutils src-tauri/binaries/coreutils-x86_64-pc-windows-msvc.exe `
            -Dll src-tauri/binaries/veloterm_goffi.dll `
            -Cmd yq -VersionArg '--version'

      # jq 分层耗时诊断 + 退出路径回归门禁：把 in-main 探针（VELOTERM_JQ_TIMING）
      # 与进程寿命的缺口归因到 pre_main / 退出路径 / 内核回收三段，并在退出码出现
      # 崩溃码（如 0xC0000374 STATUS_HEAP_CORRUPTION）或正常退出路径明显慢于
      # TerminateProcess 时硬失败。探针扩展见 vendor/jq/src/main.c（pre_main/uptime
      # + 内存/CPU 快照 + 退出路径二分 VELOTERM_JQ_EXIT_MODE / VELOTERM_JQ_EXIT_AFTER）。
      # 结果同时进 job summary。
      - name: Diagnose jq timing (layering probe + exit-path gate)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/diagnose-jq-timing.ps1 `
            -Coreutils src-tauri/binaries/coreutils-x86_64-pc-windows-msvc.exe

      - name: Upload coreutils artifact
        uses: actions/upload-artifact@v7
        with:
          name: coreutils-windows-x64
          path: src-tauri/binaries/coreutils-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 7
