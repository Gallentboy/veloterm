# 目标（单一）：relay 子工程（veloterm_relay + veloterm-relay-proto）的多平台
# 验证与部署产物——cargo test 全量 + clippy 零警告 + 四目标静态构建：
#   · linux  x86_64（ubuntu-latest）/ aarch64（ubuntu-24.04-arm 原生 ARM runner）
#     均为 musl 静态，glibc 无关随处可跑；两架构原生跑全量测试与冒烟
#   · win    x64（windows-latest）/ arm64（windows-11-arm 原生 ARM64 runner）
#     均 +crt-static 静态 CRT（终端机器无需 VC 运行库），两目标原生跑冒烟
#     （dumpbin 依赖表断言无 VCRUNTIME / api-ms-win-crt）
# 触发：推 tag（验证完删除）——
#   git tag test_relay && git push origin test_relay
#   git push origin :refs/tags/test_relay
# 也支持 workflow_dispatch 手动触发。
name: 'test-relay'

on:
  workflow_dispatch:
  push:
    tags:
      - 'test_relay*'

jobs:
  relay-linux:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub 原生 ARM64 Linux runner：无需交叉工具链/qemu，全量测试与冒烟原生跑
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: ${{ matrix.target }}

      - name: Test + Clippy (native host)
        working-directory: relay
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets

      - name: Build release (musl static)
        working-directory: relay
        run: cargo build --release -p veloterm-relay --target ${{ matrix.target }}

      - name: Smoke test binary
        run: |
          BIN=./relay/target/${{ matrix.target }}/release/veloterm_relay
          $BIN --version
          $BIN token generate --key-id 9 --name ci | grep -E 'secret = "[0-9a-f]{64}"'
          file $BIN
          # 权威静态判定：ldd 对静态二进制的措辞随形态不同——
          # gnu 环境输出 "not a dynamic executable"，static-pie 输出 "statically linked"
          ldd $BIN 2>&1 | tee /tmp/ldd.out
          grep -Eq 'not a dynamic executable|statically linked' /tmp/ldd.out

      - name: Upload relay artifact
        uses: actions/upload-artifact@v7
        with:
          name: veloterm_relay-${{ matrix.target }}
          path: relay/target/${{ matrix.target }}/release/veloterm_relay
          if-no-files-found: error
          retention-days: 7

  relay-windows:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            # 原生 ARM64 Windows runner：构建与冒烟均原生执行
            runner: windows-11-arm
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: ${{ matrix.target }}

      - name: Setup MSVC env (vcvars ${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build release (crt-static)
        working-directory: relay
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release -p veloterm-relay --target ${{ matrix.target }}
        shell: cmd

      - name: Smoke test binary (crt-static)
        shell: cmd
        run: |
          set BIN=relay\target\${{ matrix.target }}\release\veloterm_relay.exe
          %BIN% --version
          %BIN% token generate --key-id 9 --name ci | findstr /C:"secret = "
          rem crt-static 验证：依赖表不得出现 VC 运行库（VCRUNTIME / api-ms-win-crt）
          dumpbin /DEPENDENTS %BIN% > dependents.txt
          type dependents.txt
          findstr /I "VCRUNTIME api-ms-win-crt" dependents.txt
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

      - name: Upload relay artifact
        uses: actions/upload-artifact@v7
        with:
          name: veloterm_relay-${{ matrix.target }}
          path: relay/target/${{ matrix.target }}/release/veloterm_relay.exe
          if-no-files-found: error
          retention-days: 7
