# 目标（单一）：生成 4 个平台的裁剪版 JRE (Java 25: java.base,jdk.zipfs)
# 产物：
#   - vineflower-runtime-windows-x64.zip
#   - vineflower-runtime-windows-arm64.zip
#   - vineflower-runtime-macos-aarch64.tar.gz
#   - vineflower-runtime-macos-x64.tar.gz
# 触发方式：
#   - 手动触发: workflow_dispatch
#   - 推 tag: test_runtime* / runtime*
name: 'build-vineflower-runtime'

on:
  workflow_dispatch:
  push:
    tags:
      - 'test_runtime*'
      - 'runtime*'

jobs:
  build-runtime:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            arch: 'windows-x64'
            archive_name: 'vineflower-runtime-windows-x64.zip'
            is_windows: true
          - platform: 'windows-11-arm'
            arch: 'windows-arm64'
            archive_name: 'vineflower-runtime-windows-arm64.zip'
            is_windows: true
          - platform: 'macos-26'
            arch: 'macos-aarch64'
            archive_name: 'vineflower-runtime-macos-aarch64.tar.gz'
            is_windows: false
          - platform: 'macos-26-intel'
            arch: 'macos-x64'
            archive_name: 'vineflower-runtime-macos-x64.tar.gz'
            is_windows: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Run jlink to trim JRE
        shell: bash
        run: |
          jlink --add-modules java.base,jdk.zipfs \
            --output vineflower-runtime \
            --strip-debug --no-man-pages --no-header-files --compress=zip-9

      - name: Inspect and clean bin directory (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          Write-Host "=== Before Clean: bin directory contents ==="
          Get-ChildItem -Path .\vineflower-runtime\bin | Select-Object Name, Length
          # 删除 bin 下除了 java.exe 以外的所有 .exe 二进制（如 keytool.exe）
          Get-ChildItem -Path .\vineflower-runtime\bin -Filter *.exe | Where-Object { $_.Name -ne 'java.exe' } | Remove-Item -Force -Verbose
          # 删除非运行必需的 legal 目录
          if (Test-Path .\vineflower-runtime\legal) { Remove-Item -Path .\vineflower-runtime\legal -Recurse -Force }
          Write-Host "=== After Clean: bin directory contents ==="
          Get-ChildItem -Path .\vineflower-runtime\bin | Select-Object Name, Length

      - name: Inspect and clean bin directory (macOS)
        if: "!matrix.is_windows"
        shell: bash
        run: |
          echo "=== Before Clean: bin directory contents ==="
          ls -la vineflower-runtime/bin
          # 删除 bin 下除了 java 以外的二进制文件（如 keytool）
          find vineflower-runtime/bin -type f ! -name 'java' -exec rm -fv {} +
          # 删除非运行必需的 legal 目录
          rm -rf vineflower-runtime/legal
          echo "=== After Clean: bin directory contents ==="
          ls -la vineflower-runtime/bin

      - name: Smoke test trimmed runtime (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          .\vineflower-runtime\bin\java.exe -version

      - name: Smoke test trimmed runtime (macOS)
        if: "!matrix.is_windows"
        shell: bash
        run: |
          ./vineflower-runtime/bin/java -version

      - name: Package archive (Windows)
        if: matrix.is_windows
        shell: pwsh
        run: |
          Compress-Archive -Path vineflower-runtime -DestinationPath ${{ matrix.archive_name }} -Force
          Get-Item ${{ matrix.archive_name }} | Select-Object Name, Length

      - name: Package archive (macOS)
        if: "!matrix.is_windows"
        shell: bash
        run: |
          tar -czf ${{ matrix.archive_name }} vineflower-runtime
          ls -lh ${{ matrix.archive_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14

  attach-release:
    permissions:
      contents: write
    needs: [build-runtime]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all runtime artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-runtimes

      - name: Upload runtimes to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Target Release Tag: $TAG"
          mkdir -p release-assets
          find dist-runtimes -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/
          gh release upload "$TAG" release-assets/* --clobber || {
            echo "Release 不存在，尝试创建并上传..."
            gh release create "$TAG" release-assets/* --title "Vineflower JRE Runtime $TAG" --notes "Pre-built trimmed JRE (Java 25) for 4 platforms"
          }
