# tools-ci：vendor 原生编译工具段的快速测试车道（当前为 qalc 的 MSYS2 段）。
# 惯例：build-tools.mjs 里每新增一个「原生编译」工具段（--only 段），就在本
# 文件加一个对应的 --only + debug（-O0 -g）作业——只装该段的最小依赖、几分钟
# 级暴露编译/链接/静态自包含问题；publish.yml 仍是全量出包门禁（release 的
# -O2 配置由它兜底）。触发：release 分支且工具链相关路径变更时随 push 触发
# （非相关改动不烧 runner）+ 手动 workflow_dispatch。
name: 'tools-ci'

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - 'src-tauri/**'
      - 'scripts/build-tools.mjs'
      - '.github/workflows/tools-ci.yml'

jobs:
  # qalc（libqalculate）：--only qalc 只跑 MSYS2 段产 qalcffi.dll——不需要
  # Rust/vcpkg OpenSSL/Go；-O0 -g debug 编译提速。编译期/链接期/静态自包含
  # 断言与 release 配置等价暴露
  qalc-debug:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSYS2 packages for qalc (Windows)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -Sy --needed --noconfirm make gettext mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-libxml2 mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr"

      - name: Build qalcffi.dll only (debug)
        env:
          CFLAGS: '-O0 -g'
          CXXFLAGS: '-O0 -g'
        run: node scripts/build-tools.mjs --only qalc

  # coreutils 构建产物通道：产出可直接下载替换的 coreutils.exe（免装安装包），
  # 用于真机快速验证（如 jq 分段计时插桩：下载后设 VELOTERM_JQ_TIMING=1，
  # 以子命令模式运行 `coreutils.exe jq -n 1+1` 观察 stderr 分段耗时）
  coreutils-artifact:
    permissions:
      contents: read
      packages: write
    runs-on: windows-latest
    env:
      USERNAME: Gallentboy
      FEED_URL: https://nuget.pkg.github.com/Gallentboy/index.json
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/Gallentboy/index.json,readwrite'
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # jq/bc/openssl 的 C 编译依赖与 publish 相同（vcpkg OpenSSL 二进制缓存）
      - name: Add NuGet source for vcpkg binary cache (GitHub Packages)
        shell: pwsh
        run: |
          $vcpkgExe = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          $nuget = (& $vcpkgExe fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:FEED_URL"

      - name: Install OpenSSL for SQLCipher (Windows)
        working-directory: src-tauri
        shell: pwsh
        env:
          VCPKG_BUILD_TYPE: release
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT" } else { "C:\vcpkg" }
          git config --global --add safe.directory "$vcpkgRoot"
          git -C "$vcpkgRoot" fetch origin master
          if ($LASTEXITCODE -ne 0) { Write-Host "git fetch 补历史失败（exit $LASTEXITCODE），继续安装：当前镜像通常已含 baseline 历史" }
          vcpkg install "--x-install-root=$vcpkgRoot\installed"

      - name: Set OpenSSL env (Windows)
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT" } else { "C:\vcpkg" }
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Build coreutils binary
        run: node scripts/build-tools.mjs --only coreutils --target x86_64-pc-windows-msvc

      - name: Upload coreutils artifact
        uses: actions/upload-artifact@v7
        with:
          name: coreutils-windows-x64
          path: src-tauri/binaries/coreutils-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 7
