name: 'publish'

on:
  workflow_dispatch:
  push:
    # 正式发布改为 tag 触发：v 前缀或数字开头的版本 tag（如 v1.0.0 / 1.0.0）；
    # test_* 车道 tag 不匹配任一模式，不会误触发。release 分支常规推送不再出包。
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  publish-tauri:
    permissions:
      contents: write
      # vcpkg 二进制缓存推送/拉取 GitHub Packages（NuGet feed）所需
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (64-bit x86). Only this platform is built.
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    env:
      # vcpkg 二进制缓存走 GitHub Packages NuGet 源（官方教程：
      # learn.microsoft.com/vcpkg/consume/binary-caching-github-packages）。
      # 旧 x-gha 后端已于 2025-04 从 vcpkg-tool 移除（GitHub 下线了它用的内部缓存 API），
      # 之前的 ACTIONS_CACHE_URL 导出 + x-gha 写法完全失效，这就是每次重新编译 OpenSSL 的根因。
      USERNAME: Gallentboy
      FEED_URL: https://nuget.pkg.github.com/Gallentboy/index.json
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/Gallentboy/index.json,readwrite'
    steps:
      # action 主版本随 runner 运行时升级（node20 已弃用，会被强制跑在 node24 上
      # 并打弃用告警；checkout/setup-node v7、pnpm/action-setup v6 原生 node24）
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 1. 用 GITHUB_TOKEN 把 GitHub Packages 注册为 NuGet 源（写入运行器用户级 NuGet.Config，
      #    vcpkg 内部调用的 nuget.exe 会读同一份配置）。若首次推送遇到 401（组织限制默认
      #    token 权限），改用具备 packages:read/write 的经典 PAT 存为 VCPKG_PAT_TOKEN 并替换下方两处 token 引用
      - name: Add NuGet source for vcpkg binary cache (GitHub Packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgExe = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          $nuget = (& $vcpkgExe fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:FEED_URL"

      # 2. 安装 OpenSSL（manifest 模式，版本锁在 src-tauri/vcpkg.json 的 overrides）。
      #    锁版本必须是 vcpkg 上游版本数据库实有的版本（曾错锁 versions 库里不存在
      #    的 3.6.5——classic 模式跟随 runner ports 快照装出过它，但 manifest 解析
      #    直接报 no version database entry；上游实有最高为 3.6.4#1）。
      #    先 git fetch 补齐 runner 内置 vcpkg 仓库历史：builtin-baseline 指向打包
      #    manifest 时的 vcpkg master SHA，旧世代镜像的仓库里没有该 commit（实测报
      #    "failed to git show versions/baseline.json ... This may be fixed by
      #    fetching commits with git fetch"）；fetch master 增量后对象可达，版本解析
      #    从 git 历史读取版本化 port，不动工作树。
      #    首次运行按 baseline 编译并把二进制包推送到 GitHub Packages，后续命中
      #    feed 直接秒级恢复。VCPKG_BUILD_TYPE=release：跳过 debug 配置只编 release。
      #    --x-install-root 把 manifest 产物装进 classic 目录（<vcpkg根>\installed\<triplet>）
      #    而非默认的 <清单目录>\vcpkg_installed\：OPENSSL_LIB_DIR 的字符串必须与
      #    rust-cache 恢复的旧构建产物里烘焙的链接搜索路径一致——libsqlite3-sys 的
      #    bundled 路径【未声明 rerun-if-env-changed=OPENSSL_LIB_DIR】，改环境变量
      #    cargo 也不会重跑它的 build script，只会重放缓存的旧 rustc-link-search；
      #    路径指向不存在的目录时最终链接 app.exe 直接 LNK1104（CI 实测）。
      #    固定装进 classic 目录后路径世代恒定，缓存重放永远指向有效位置
      - name: Install OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        env:
          VCPKG_BUILD_TYPE: release
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          # C:\vcpkg 由镜像生成账户检出、作业以 runneradmin 运行：git 视为可疑属主
          # 拒绝操作（exit 128），先放行再 fetch
          git config --global --add safe.directory "$vcpkgRoot"
          # 补历史属保险动作：fetch 失败（非 git 仓库/网络问题）不阻塞安装——
          # 当前世代镜像已含 builtin-baseline 的历史，此前多轮 CI 均靠镜像自带历史通过
          git -C "$vcpkgRoot" fetch origin master
          if ($LASTEXITCODE -ne 0) { Write-Host "git fetch 补历史失败（exit $LASTEXITCODE），继续安装：当前镜像通常已含 baseline 历史" }
          vcpkg install "--x-install-root=$vcpkgRoot\installed"

      # 3. 设置 Rust 静态链接 OpenSSL 所需的环境变量。路径必须是 <vcpkg根>\installed\
      #    <triplet>（与上方 Install 步骤的 --x-install-root 一致）：除缓存重放的
      #    原因外，openssl-app 的 build.rs 兜底逻辑也按该根目录布局探测
      - name: Set OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # 4. 校验版本三处一致：vcpkg.json 的 override（安装侧）、vendor/openssl-src/
      #    VELOTERM_VERSION（源码锁版本）、以及 runner 实装头文件里的真实版本。
      #    前两处是手维护的双源，漂移在此拦截；第三处防 manifest 解析异常。
      #    openssl-app 的 build.rs 默认直接使用 vendor/openssl-src（无需 CI 提供源码）
      - name: Verify vcpkg OpenSSL version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $header = Get-Content "$env:OPENSSL_INCLUDE_DIR\openssl\opensslv.h" -Raw
          $installed = [regex]::Match($header, 'OPENSSL_VERSION_TEXT\s+"OpenSSL\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          $locked = (Get-Content src-tauri/vendor/openssl-src/VELOTERM_VERSION -Raw).Trim()
          $manifest = (Get-Content src-tauri/vcpkg.json -Raw | ConvertFrom-Json).overrides | Where-Object { $_.name -eq 'openssl' } | Select-Object -ExpandProperty version
          # override 的 #N 是 vcpkg port-version（打包层修订号），不属于 OpenSSL
          # 版本语义，VELOTERM_VERSION 只记上游版本——比较前剥掉后缀
          $manifestUpstream = ($manifest -split '#')[0]
          Write-Host "vcpkg 实装: $installed / 源码锁死: $locked / manifest override: $manifest"
          if ($locked -ne $manifestUpstream) { throw "双源不一致：VELOTERM_VERSION=$locked 但 vcpkg.json override=$manifest，升级时两处必须同步修改" }
          if ($installed -ne $locked) { throw "版本不一致：实装 $installed ≠ 锁死 $locked。请按 src-tauri/vendor/openssl-src/README.md 升级锁版本（apps + include/internal + VELOTERM_VERSION + vcpkg.json override）" }

      # 5. 安装 qalc（libqalculate）构建所需的 MSYS2 MinGW64 工具链与依赖：
      #    runner 预装 C:\msys64，只补包。libqalculate 是 autotools C++ 库
      #    （GMP/MPFR/libxml2 硬依赖），无 MSVC 工程且官方 Windows 版即
      #    MinGW 构建——build-tools.mjs 在该环境里 configure/make 出静态库
      #    并链接自包含的 qalcffi.dll（见 vendor/libqalculate/README.md）。
      #    仅是构建期依赖：安装包内的 qalcffi.dll 依赖全静态打入，最终用户
      #    不需要 MSYS2。pacman -Sy：runner 镜像的包数据库未同步，直接
      #    -S 会报 target not found。
      #    （nmap 不走此段：走 MSVC + CMake，见 build-tools.mjs 的 nmap 段
      #    与 vendor/nmap/veloterm-win/CMakeLists.txt，复用上面的 vcpkg OpenSSL。）
      - name: Install MSYS2 packages for qalc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -Sy --needed --noconfirm make gettext mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-libxml2 mingw-w64-x86_64-gmp mingw-w64-x86_64-mpfr"

      # 编译 coreutils 多呼叫二进制（uutils/coreutils 全集 + vendor 的 grep/sed/
      # findutils/diffutils/ripgrep/fd/sd/frawk/rust-parallel/onefetch/eza/wget/tar；
      # which/ps/top 为自研）
      # 到 src-tauri/binaries/ 供 Tauri externalBin 打进安装包（--target 须与构建矩阵一致）；
      # 安装后应用启动时在 tools/ 下创建硬链接短名入口（ls.exe/grep.exe/…）
      - name: Build coreutils binary
        run: node scripts/build-tools.mjs --target x86_64-pc-windows-msvc

      # 前端依赖安装排在 coreutils 编译之后：build-tools.mjs 只用 Node 内建模块
      # （child_process/fs/path/url），不依赖 node_modules——先编工具链，能在耗时
      # 的依赖安装与打包之前尽早暴露 Windows 专属编译问题（jq/yq/fzf/qalc/openssl-app）
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 安装包内容核验：断言全部六个 FFI DLL 落在 lib/ 子目录、nmap-data/ 与
      # vim-runtime/ 仍平铺在安装根、且安装根没有 DLL 残留（本轮起统一进 lib/）。
      # 运行期解析逻辑由单测与 test-jq 车道的 verify-dll-layout.ps1 覆盖，但
      # bundle.resources 的
      # 映射笔误只有检查真实安装包才能发现（三条映射，漏改一条不影响其余）。
      # 7z 缺失时脚本跳过并告警（不误判失败）。
      - name: Verify installer layout (lib/ DLL placement)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/VeloTerm_${ver}_x64-setup.exe"
          pwsh -NoProfile -File scripts/verify-installer-layout.ps1 -Installer $setup

  # ── relay 中继程序的四目标发布（relay/** 有变化才构建，产物挂 Releases 页面）──
  # 与 test-relay.yml 车道同源（构建/冒烟步骤一致），区别：车道是全量验证
  # （含 cargo test），这里只出产物；变更探测失败/首推/手动派发时保守视为有变化。
  relay-changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      relay: ${{ steps.detect.outputs.relay }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect relay path changes
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          # 空值（手动派发）或取不到 before（首推/强推/浅历史）→ 保守视为有变化
          if [ -z "$BEFORE" ] || git cat-file -e "$BEFORE" 2>/dev/null; then :; else
            if ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
              echo "relay=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ -z "$BEFORE" ]; then
            echo "relay=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 双端树快照直 diff（无需 merge-base，浅取回的 before 即可）
          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- relay/ | grep -q .; then
            echo "relay=true" >> "$GITHUB_OUTPUT"
          else
            echo "relay=false" >> "$GITHUB_OUTPUT"
          fi

  relay-release-linux:
    permissions:
      contents: read
    needs: relay-changes
    if: needs.relay-changes.outputs.relay == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: ${{ matrix.target }}
      - name: Build release (musl static)
        working-directory: relay
        run: cargo build --release -p veloterm-relay --target ${{ matrix.target }}
      - name: Smoke test binary
        run: |
          BIN=./relay/target/${{ matrix.target }}/release/veloterm_relay
          $BIN --version
          $BIN token generate --key-id 9 --name ci | grep -E 'secret = "[0-9a-f]{64}"'
          ldd $BIN 2>&1 | tee /tmp/ldd.out
          grep -Eq 'not a dynamic executable|statically linked' /tmp/ldd.out
      - uses: actions/upload-artifact@v7
        with:
          name: veloterm_relay-${{ matrix.target }}
          path: relay/target/${{ matrix.target }}/release/veloterm_relay
          if-no-files-found: error
          retention-days: 7

  relay-release-windows:
    permissions:
      contents: read
    needs: relay-changes
    if: needs.relay-changes.outputs.relay == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: ${{ matrix.target }}
      # 内联 vcvars（vswhere + vcvarsall + GITHUB_ENV 导出，无第三方 action）
      - name: Setup MSVC env (vcvars ${{ matrix.msvc_arch }})
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere 未找到 Visual Studio" }
          $vcvars  = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
          Write-Host "vcvars: $vcvars (${{ matrix.msvc_arch }})"
          cmd /s /c "`"$vcvars`" ${{ matrix.msvc_arch }} && set" | ForEach-Object {
            if ($_ -match '^(?<k>[^=]+)=(?<v>.*)$') {
              Add-Content $env:GITHUB_ENV "$($Matches.k)=$($Matches.v)"
            }
          }
      - name: Build release (crt-static)
        working-directory: relay
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release -p veloterm-relay --target ${{ matrix.target }}
        shell: cmd
      - name: Smoke test binary (crt-static)
        shell: cmd
        run: |
          set BIN=relay\target\${{ matrix.target }}\release\veloterm_relay.exe
          %BIN% --version
          %BIN% token generate --key-id 9 --name ci | findstr /C:"secret = "
          dumpbin /DEPENDENTS %BIN% > dependents.txt
          type dependents.txt
          findstr /I "VCRUNTIME api-ms-win-crt" dependents.txt
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0
      - uses: actions/upload-artifact@v7
        with:
          name: veloterm_relay-${{ matrix.target }}
          path: relay/target/${{ matrix.target }}/release/veloterm_relay.exe
          if-no-files-found: error
          retention-days: 7

  # 等应用 release（tauri-action 的 app-v<version> 草稿）产出后，把四个中继
  # 二进制挂到同一 Releases 页面。应用侧失败则本 job 跳过（needs 短路）。
  relay-release-attach:
    permissions:
      contents: write
    needs: [relay-changes, relay-release-linux, relay-release-windows, publish-tauri]
    if: needs.relay-changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: veloterm_relay-*
          path: relay-bin
      - name: Attach relay binaries to app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="app-v${VER}"
          # tauri-action 产出的是 draft release（tag 未落地），按 tag_name 在 releases 列表里找
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            -q ".[] | select(.tag_name == \"${TAG}\") | .id" | head -1)
          if [ -z "$RID" ]; then
            echo "未找到 ${TAG} 对应的 release（tauri-action 未产出或版本异常）"; exit 1
          fi
          echo "release id=$RID tag=$TAG"
          # 清掉同 release 上已有的 veloterm_relay-* 资产（重跑/改名幂等，避免新旧并存）
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" --paginate \
            -q ".[] | select(.name | startswith(\"veloterm_relay-\")) | (.id|tostring)" \
            | while read -r aid; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}"
              done
          # 发布资产用简短友好命名（用户指定）：
          #   linux-x86 / linux-aarch64（无后缀）、x64.exe / arm64.exe（Windows 静态 CRT）
          find relay-bin -type f \( -name 'veloterm_relay' -o -name 'veloterm_relay.exe' \) | while read -r f; do
            TARGET="$(basename "$(dirname "$f")")"; TARGET="${TARGET#veloterm_relay-}"
            case "$TARGET" in
              x86_64-unknown-linux-musl)  ASSET="veloterm_relay-linux-x86";;
              aarch64-unknown-linux-musl) ASSET="veloterm_relay-linux-aarch64";;
              x86_64-pc-windows-msvc)     ASSET="veloterm_relay-x64.exe";;
              aarch64-pc-windows-msvc)    ASSET="veloterm_relay-arm64.exe";;
              *) echo "未知目标: $TARGET"; exit 1;;
            esac
            echo "upload: $ASSET"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=${ASSET}" \
              -H "Content-Type: application/octet-stream" --input "$f"
          done
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}" -q '.html_url'
