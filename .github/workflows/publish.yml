name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
      # vcpkg 二进制缓存推送/拉取 GitHub Packages（NuGet feed）所需
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (64-bit x86). Only this platform is built.
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    env:
      # vcpkg 二进制缓存走 GitHub Packages NuGet 源（官方教程：
      # learn.microsoft.com/vcpkg/consume/binary-caching-github-packages）。
      # 旧 x-gha 后端已于 2025-04 从 vcpkg-tool 移除（GitHub 下线了它用的内部缓存 API），
      # 之前的 ACTIONS_CACHE_URL 导出 + x-gha 写法完全失效，这就是每次重新编译 OpenSSL 的根因。
      USERNAME: Gallentboy
      FEED_URL: https://nuget.pkg.github.com/Gallentboy/index.json
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/Gallentboy/index.json,readwrite'
    steps:
      # action 主版本随 runner 运行时升级（node20 已弃用，会被强制跑在 node24 上
      # 并打弃用告警；checkout/setup-node v7、pnpm/action-setup v6 原生 node24）
      - uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 1. 用 GITHUB_TOKEN 把 GitHub Packages 注册为 NuGet 源（写入运行器用户级 NuGet.Config，
      #    vcpkg 内部调用的 nuget.exe 会读同一份配置）。若首次推送遇到 401（组织限制默认
      #    token 权限），改用具备 packages:read/write 的经典 PAT 存为 VCPKG_PAT_TOKEN 并替换下方两处 token 引用
      - name: Add NuGet source for vcpkg binary cache (GitHub Packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgExe = if ($env:VCPKG_INSTALLATION_ROOT) { "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" } else { "C:\vcpkg\vcpkg.exe" }
          $nuget = (& $vcpkgExe fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$env:FEED_URL"

      # 2. 安装 OpenSSL（manifest 模式，版本锁在 src-tauri/vcpkg.json 的 overrides）。
      #    锁版本必须是 vcpkg 上游版本数据库实有的版本（曾错锁 versions 库里不存在
      #    的 3.6.5——classic 模式跟随 runner ports 快照装出过它，但 manifest 解析
      #    直接报 no version database entry；上游实有最高为 3.6.4#1）。
      #    先 git fetch 补齐 runner 内置 vcpkg 仓库历史：builtin-baseline 指向打包
      #    manifest 时的 vcpkg master SHA，旧世代镜像的仓库里没有该 commit（实测报
      #    "failed to git show versions/baseline.json ... This may be fixed by
      #    fetching commits with git fetch"）；fetch master 增量后对象可达，版本解析
      #    从 git 历史读取版本化 port，不动工作树。
      #    首次运行按 baseline 编译并把二进制包推送到 GitHub Packages，后续命中
      #    feed 直接秒级恢复。VCPKG_BUILD_TYPE=release：跳过 debug 配置只编 release。
      #    --x-install-root 把 manifest 产物装进 classic 目录（<vcpkg根>\installed\<triplet>）
      #    而非默认的 <清单目录>\vcpkg_installed\：OPENSSL_LIB_DIR 的字符串必须与
      #    rust-cache 恢复的旧构建产物里烘焙的链接搜索路径一致——libsqlite3-sys 的
      #    bundled 路径【未声明 rerun-if-env-changed=OPENSSL_LIB_DIR】，改环境变量
      #    cargo 也不会重跑它的 build script，只会重放缓存的旧 rustc-link-search；
      #    路径指向不存在的目录时最终链接 app.exe 直接 LNK1104（CI 实测）。
      #    固定装进 classic 目录后路径世代恒定，缓存重放永远指向有效位置
      - name: Install OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        env:
          VCPKG_BUILD_TYPE: release
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          # C:\vcpkg 由镜像生成账户检出、作业以 runneradmin 运行：git 视为可疑属主
          # 拒绝操作（exit 128），先放行再 fetch
          git config --global --add safe.directory "$vcpkgRoot"
          # 补历史属保险动作：fetch 失败（非 git 仓库/网络问题）不阻塞安装——
          # 当前世代镜像已含 builtin-baseline 的历史，此前多轮 CI 均靠镜像自带历史通过
          git -C "$vcpkgRoot" fetch origin master
          if ($LASTEXITCODE -ne 0) { Write-Host "git fetch 补历史失败（exit $LASTEXITCODE），继续安装：当前镜像通常已含 baseline 历史" }
          vcpkg install "--x-install-root=$vcpkgRoot\installed"

      # 3. 设置 Rust 静态链接 OpenSSL 所需的环境变量。路径必须是 <vcpkg根>\installed\
      #    <triplet>（与上方 Install 步骤的 --x-install-root 一致）：除缓存重放的
      #    原因外，openssl-app 的 build.rs 兜底逻辑也按该根目录布局探测
      - name: Set OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # 4. 校验版本三处一致：vcpkg.json 的 override（安装侧）、vendor/openssl-src/
      #    VELOTERM_VERSION（源码锁版本）、以及 runner 实装头文件里的真实版本。
      #    前两处是手维护的双源，漂移在此拦截；第三处防 manifest 解析异常。
      #    openssl-app 的 build.rs 默认直接使用 vendor/openssl-src（无需 CI 提供源码）
      - name: Verify vcpkg OpenSSL version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $header = Get-Content "$env:OPENSSL_INCLUDE_DIR\openssl\opensslv.h" -Raw
          $installed = [regex]::Match($header, 'OPENSSL_VERSION_TEXT\s+"OpenSSL\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          $locked = (Get-Content src-tauri/vendor/openssl-src/VELOTERM_VERSION -Raw).Trim()
          $manifest = (Get-Content src-tauri/vcpkg.json -Raw | ConvertFrom-Json).overrides | Where-Object { $_.name -eq 'openssl' } | Select-Object -ExpandProperty version
          # override 的 #N 是 vcpkg port-version（打包层修订号），不属于 OpenSSL
          # 版本语义，VELOTERM_VERSION 只记上游版本——比较前剥掉后缀
          $manifestUpstream = ($manifest -split '#')[0]
          Write-Host "vcpkg 实装: $installed / 源码锁死: $locked / manifest override: $manifest"
          if ($locked -ne $manifestUpstream) { throw "双源不一致：VELOTERM_VERSION=$locked 但 vcpkg.json override=$manifest，升级时两处必须同步修改" }
          if ($installed -ne $locked) { throw "版本不一致：实装 $installed ≠ 锁死 $locked。请按 src-tauri/vendor/openssl-src/README.md 升级锁版本（apps + include/internal + VELOTERM_VERSION + vcpkg.json override）" }

      # 编译 coreutils 多呼叫二进制（uutils/coreutils 全集 + vendor 的 grep/sed/
      # findutils/diffutils/ripgrep/fd/sd/frawk/eza/wget/tar；仅 which 为自研）
      # 到 src-tauri/binaries/ 供 Tauri externalBin 打进安装包（--target 须与构建矩阵一致）；
      # 安装后应用启动时在 tools/ 下创建硬链接短名入口（ls.exe/grep.exe/…）
      - name: Build coreutils binary
        run: node scripts/build-tools.mjs --target x86_64-pc-windows-msvc

      # 前端依赖安装排在 coreutils 编译之后：build-tools.mjs 只用 Node 内建模块
      # （child_process/fs/path/url），不依赖 node_modules——先编工具链，能在耗时
      # 的依赖安装与打包之前尽早暴露 Windows 专属编译问题（jq/yq/openssl-app）
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
