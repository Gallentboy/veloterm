name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (64-bit x86). Only this platform is built.
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地生成 pnpm-lock.yaml 的版本保持一致，避免 --frozen-lockfile 跨大版本兼容问题
          version: 11

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # SQLCipher（加密 SQLite）的 libsqlite3-sys build.rs 在 Windows 上需要 OpenSSL 做加密后端，
      # macOS 有系统 OpenSSL 而 CI 无；用 vcpkg 预装的静态 triplet（/MT + 静态 openssl），
      # 与 .cargo/config.toml 的 +crt-static 完全自洽，产物保持零运行时依赖
      - name: Install OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows-static

      - name: Set OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\x64-windows-static\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows-static\include" >> $env:GITHUB_ENV

      - name: install frontend dependencies
        # beforeBuildCommand in src-tauri/tauri.conf.json runs `pnpm build`.
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
