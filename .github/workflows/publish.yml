name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (64-bit x86). Only this platform is built.
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 1. 导出 GitHub Actions Cache 凭据给 vcpkg 的 x-gha 二进制缓存提供程序
      - name: Export GitHub Actions Cache env for vcpkg
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      # 2. 安装 OpenSSL（首次运行会编译并自动写入 GitHub Cache，后续运行直接秒级下载二进制恢复）
      - name: Install OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows-static

      # 3. 设置 Rust 静态链接 OpenSSL 所需的环境变量
      - name: Set OpenSSL env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static"
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$opensslDir\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 编译 coreutils 多呼叫二进制（uutils/coreutils + 自研 grep/sed/which）
      # 到 src-tauri/binaries/ 供 Tauri externalBin 打进安装包（--target 须与构建矩阵一致）；
      # 安装后应用启动时在 tools/ 下创建硬链接短名入口（ls.exe/grep.exe/…）
      - name: Build coreutils binary
        run: node scripts/build-tools.mjs --target x86_64-pc-windows-msvc

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
