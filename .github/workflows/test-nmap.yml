# 目标（单一）：nmapffi.dll + nmap-data/ 的 debug 快速构建（nmap 的 MSYS2
# autotools 段，-O0 -g 提速；编译期/链接期/静态自包含断言与 release 配置
# 等价暴露）。只依赖 MSYS2（较 qalc 段另加 cmake/ninja/openssl/unzip）——
# 不需要 Rust/vcpkg OpenSSL/Go；段内 runner 冒烟（--version / -sT 127.0.0.1）
# 在无 Npcap 的 runner 上正好回归 Packet.dll 延迟导入 + winfix 降级补丁路径。
# 触发：推 tag（验证完删除）——
#   git tag test_nmap && git push origin test_nmap
#   git push origin :refs/tags/test_nmap
# 也支持 workflow_dispatch 手动触发。
name: 'test-nmap'

on:
  workflow_dispatch:
  push:
    tags:
      - 'test_nmap*'

jobs:
  build-nmap:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSYS2 packages for nmap (Windows)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -l -c "pacman -Sy --needed --noconfirm make gettext unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-openssl"

      - name: Build nmapffi.dll only (debug)
        env:
          CFLAGS: '-O0 -g'
          CXXFLAGS: '-O0 -g'
        run: node scripts/build-tools.mjs --only nmap

      - name: Upload nmapffi artifact
        uses: actions/upload-artifact@v7
        with:
          name: nmapffi-windows-x64
          path: |
            src-tauri/binaries/nmapffi.dll
            src-tauri/binaries/nmap-data/
          if-no-files-found: error
          retention-days: 7
