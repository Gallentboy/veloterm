[package]
name = "uu_grep"
description = "A Rust implementation of GNU Grep"
repository = "https://github.com/uutils/grep"
edition = "2024"
rust-version = "1.88.0"
version = "0.2.0"
license = "MIT"
homepage = "https://github.com/uutils/grep"
keywords = ["grep", "uutils", "cross-platform", "cli", "utility"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "grep"
path = "src/main.rs"

[lib]
name = "uu_grep"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
glob = "0.3.1"
memchr = "2.7.2"
onig = { version = "~6.5.1", default-features = false }
onig_sys = { version = "*", default-features = false }
# VeloTerm vendor 修改：uucore 从 crates.io 0.10 切到工程内 vendor 的
# coreutils 0.12（../coreutils/src/uucore），与 coreutils 命令共用同一份
# uucore，避免图中出现两个 uucore 版本。已核实 uu_grep 用到的 API
# （Args / UResult / #[uucore::main(no_signals)] / clap_localization::
# handle_clap_result_with_exit_code）在 0.12 均存在。
uucore = { path = "../coreutils/src/uucore", version = "0.12.0" }
walkdir = "2.5"

[[bench]]
name = "grep_bench"
harness = false

[dev-dependencies]
criterion = { version = "5.0.0", package = "codspeed-criterion-compat" }
uutests = "0.10.0"

[profile.dist]
inherits = "release"
lto = "fat"
