# oceanbase_async：mysql_async 0.35.1 的 veloterm vendor 分叉（libmariadb/libobclient
# 的纯 Rust 对位实现的第一阶段）。
#
# 与上游的差异（对照 src-tauri/vendor/obconnector-c 的 C 源逐条移植，wire 格式
# 以 ob_protocol20.c / ma_net.c / mariadb_lib.c 为准）：
# - 新增 src/ob20.rs：OceanBase 2.0 协议层（OB20 头/CRC16/CRC32/能力位/
#   connect attrs 键值）——OB Oracle 租户在标准 MySQL 握手之后叠加的包格式。
# 上游其余代码保持原样（MIT/Apache-2.0，见 LICENSE-*），后续阶段在 io 层接入
# ob20 编解码并接 engines.rs（保留 libobclient FFI 回退）。
[package]
authors = ["blackbeam <aikorsky@gmail.com>"]
description = "Tokio based asynchronous MySql client library (veloterm OceanBase fork)"
documentation = "https://docs.rs/mysql_async"
keywords = ["mysql", "oceanbase", "database", "asynchronous", "async"]
license = "MIT/Apache-2.0"
name = "oceanbase_async"
readme = "README.md"
repository = "https://github.com/blackbeam/mysql_async"
version = "0.35.1"
exclude = ["test/*"]
edition = "2021"
categories = ["asynchronous", "database"]

[dependencies]
bytes = "1.4"
crc32fast = "1"
crossbeam = "0.8.1"
flate2 = { version = "1.0", default-features = false }
futures-core = "0.3"
futures-util = "0.3"
futures-sink = "0.3"
keyed_priority_queue = "0.4"
lru = "0.12.0"
mysql_common = { version = "0.34", default-features = false }
pem = "3.0"
percent-encoding = "2.1.0"
pin-project = "1.0.2"
rand = "0.8.5"
serde = "1"
serde_json = "1"
socket2 = "0.5.2"
thiserror = "2"
tokio = { version = "1.0", features = ["io-util", "fs", "net", "time", "rt"] }
tokio-util = { version = "0.7.2", features = ["codec", "io"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
url = "2.1"

tracing = { version = "0.1.37", default-features = false, features = [
    "attributes",
], optional = true }
hdrhistogram = { version = "7.5", optional = true }

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
optional = true

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["std"]
optional = true

[dependencies.rustls-pemfile]
version = "2.1.0"
optional = true

[dependencies.webpki]
version = ">=0.22.1"
features = ["std"]
optional = true

[dependencies.webpki-roots]
version = "0.26.1"
optional = true

[dev-dependencies]
waker-fn = "1"
tempfile = "3.1.0"
socket2 = { version = "0.5.2", features = ["all"] }
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = ["flate2/rust_backend", "derive"]

# rustls based TLS support（veloterm：只保留 rustls 形态，native-tls 弃用——
# 与 app 全局 aws-lc-rs provider 约束一致）
default-rustls = ["default-rustls-no-provider", "aws-lc-rs"]
default-rustls-ring = ["default-rustls-no-provider", "ring"]
default-rustls-no-provider = ["rustls-tls", "tls12"]
minimal = ["flate2/rust_backend"]
minimal-rust = ["flate2/rust_backend"]
rustls-tls = [
    "rustls",
    "tokio-rustls",
    "webpki",
    "webpki-roots",
    "rustls-pemfile",
]
aws-lc-rs = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
ring = ["rustls/ring", "tokio-rustls/ring"]
tls12 = ["rustls/tls12", "tokio-rustls/tls12"]
binlog = ["mysql_common/binlog"]
derive = ["mysql_common/derive"]
chrono = ["mysql_common/chrono"]
time = ["mysql_common/time"]
bigdecimal = ["mysql_common/bigdecimal"]
rust_decimal = ["mysql_common/rust_decimal"]
frunk = ["mysql_common/frunk"]
tracing = ["dep:tracing"]
nightly = []

[lib]
name = "oceanbase_async"
path = "src/lib.rs"

[profile.bench]
debug = true
