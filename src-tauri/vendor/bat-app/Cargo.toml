# ── bat-app sys-crate ────────────────────────────────────────────────────────
# 把 bat 的 CLI（sharkdp/bat 0.26.1，库在 ../bat）编入 coreutils 多呼叫二进制。
#
# bat 上游是「库 + bin」分离：CLI（clap 解析、App/Controller 装配）在
# ../bat/src/bin/bat/，作为库分发时不可调用。本 crate 的 [lib] path 直接指向
# 该 main.rs——它既是 bat 独立 bin target 的入口（`fn main`，构建依赖时
# 不编），也是本 crate 的 crate 根：内部的 `mod app;` 等声明相对该文件
# 目录解析（与 bin target 布局一致），`crate::xxx` 命中 crate 根，
# `use bat::xxx` 命中 path 依赖的库。main.rs 仅一处 vendor 修补
# （追加 bat_main()，见该文件末尾）。与 jq-app/bc-app 同型。
#
# bin 文件直接引用的外部 crate（clap/console/etcetera/globset/nu-ansi-term/
# once_cell/wild/shell-words）在本 crate 重复声明，版本与 ../bat 一致——
# 同一 lock 下自动统一为一份。
#
# feature 取舍（经对 bat 的依赖声明）：禁 git（libgit2 C 库，-G 行标记不可
# 用）与 paging（minus 钉 crossterm ^0.27，与工程 0.29 双版本冲突；--paging
# 恒等效 never）；regex-fancy 替代默认 regex-onig（oniguruma C 库）；
# build-assets 关闭（语法/主题走 tarball 内嵌 .bin，bat cache --build 不可用）。
# bat 侧随本组合打了两处小修补（PagingMode 无条件导出、shell-words 必需化），
# 见 ../bat/src/lib.rs 与 ../bat/Cargo.toml 的 veloterm 注释。
[package]
name = "bat-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "bat CLI (sharkdp/bat 0.26.1) 编入：vendor 源码 + bin 侧 CLI 的 lib 化挂载"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "bat_app"
path = "../bat/src/bin/bat/main.rs"

# crate 根（bin 的 main.rs）里大量 `#[cfg(feature = "...")]` 检查的是 bat 的
# feature 名——Cargo 按「正在编译的 crate」判定 cfg，本 crate 不声明这些名字
# 会触发 unexpected_cfgs 警告。这里声明为空 feature（我们全部不启用，恒
# false，行为不变）：要开某项时同时把它加进上方 bat 依赖的 features 列表。
[features]
application = []
bugreport = []
build-assets = []
git = []
lessopen = []
paging = []
regex-onig = []
regex-fancy = []

[dependencies]
bat = { path = "../bat", default-features = false, features = [
    "clap",
    "etcetera",
    "regex-fancy",
    "wild",
] }
# bin 文件直接引用的外部 crate（版本照抄 ../bat 的清单）
clap = { version = "4.5.46", features = ["wrap_help", "cargo"] }
console = "0.16.0"
etcetera = "0.11.0"
globset = "0.4"
nu-ansi-term = "0.50.0"
once_cell = "1.20"
shell-words = "1.1.0"
wild = "2.2"
