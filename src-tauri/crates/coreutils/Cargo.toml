uu_rm = { path = "../../vendor/coreutils/src/uu/rm" }
uu_rmdir = { path = "../../vendor/coreutils/src/uu/rmdir" }
uu_seq = { path = "../../vendor/coreutils/src/uu/seq" }
uu_sha1sum = { path = "../../vendor/coreutils/src/uu/sha1sum" }
uu_sha224sum = { path = "../../vendor/coreutils/src/uu/sha224sum" }
uu_sha256sum = { path = "../../vendor/coreutils/src/uu/sha256sum" }
uu_sha384sum = { path = "../../vendor/coreutils/src/uu/sha384sum" }
uu_sha512sum = { path = "../../vendor/coreutils/src/uu/sha512sum" }
uu_shred = { path = "../../vendor/coreutils/src/uu/shred" }
uu_shuf = { path = "../../vendor/coreutils/src/uu/shuf" }
uu_sleep = { path = "../../vendor/coreutils/src/uu/sleep" }
uu_sort = { path = "../../vendor/coreutils/src/uu/sort" }
uu_split = { path = "../../vendor/coreutils/src/uu/split" }
uu_sum = { path = "../../vendor/coreutils/src/uu/sum" }
uu_sync = { path = "../../vendor/coreutils/src/uu/sync" }
uu_tac = { path = "../../vendor/coreutils/src/uu/tac" }
uu_tail = { path = "../../vendor/coreutils/src/uu/tail" }
uu_tee = { path = "../../vendor/coreutils/src/uu/tee" }
uu_test = { path = "../../vendor/coreutils/src/uu/test" }
uu_timeout = { path = "../../vendor/coreutils/src/uu/timeout" }
uu_touch = { path = "../../vendor/coreutils/src/uu/touch" }
uu_tr = { path = "../../vendor/coreutils/src/uu/tr" }
uu_true = { path = "../../vendor/coreutils/src/uu/true" }
uu_truncate = { path = "../../vendor/coreutils/src/uu/truncate" }
uu_tsort = { path = "../../vendor/coreutils/src/uu/tsort" }
uu_tty = { path = "../../vendor/coreutils/src/uu/tty" }
uu_uname = { path = "../../vendor/coreutils/src/uu/uname" }
uu_unexpand = { path = "../../vendor/coreutils/src/uu/unexpand" }
uu_uniq = { path = "../../vendor/coreutils/src/uu/uniq" }
uu_unlink = { path = "../../vendor/coreutils/src/uu/unlink" }
uu_uptime = { path = "../../vendor/coreutils/src/uu/uptime" }
uu_vdir = { path = "../../vendor/coreutils/src/uu/vdir" }
uu_wc = { path = "../../vendor/coreutils/src/uu/wc" }
uu_whoami = { path = "../../vendor/coreutils/src/uu/whoami" }
uu_yes = { path = "../../vendor/coreutils/src/uu/yes" }

# unix 专属命令（uutils feat_require_unix_core + feat_require_unix_utmpx）
[target.'cfg(unix)'.dependencies]
uu_chgrp = { path = "../../vendor/coreutils/src/uu/chgrp" }
uu_chmod = { path = "../../vendor/coreutils/src/uu/chmod" }
uu_chown = { path = "../../vendor/coreutils/src/uu/chown" }
uu_chroot = { path = "../../vendor/coreutils/src/uu/chroot" }
uu_groups = { path = "../../vendor/coreutils/src/uu/groups" }
uu_id = { path = "../../vendor/coreutils/src/uu/id" }
uu_install = { path = "../../vendor/coreutils/src/uu/install" }
uu_logname = { path = "../../vendor/coreutils/src/uu/logname" }
uu_mkfifo = { path = "../../vendor/coreutils/src/uu/mkfifo" }
uu_mknod = { path = "../../vendor/coreutils/src/uu/mknod" }
uu_stat = { path = "../../vendor/coreutils/src/uu/stat" }
uu_stty = { path = "../../vendor/coreutils/src/uu/stty" }
uu_pinky = { path = "../../vendor/coreutils/src/uu/pinky" }
uu_users = { path = "../../vendor/coreutils/src/uu/users" }
uu_who = { path = "../../vendor/coreutils/src/uu/who" }

# stdbuf：unix 与 windows 均可用
[target.'cfg(any(unix, windows))'.dependencies]
uu_stdbuf = { path = "../../vendor/coreutils/src/uu/stdbuf" }

# 仅 Windows：openssl CLI、telnet CLI、bc/jq CLI（vendor 源码 cc 现场编译）
# 与 yq/qalc（Go 源码经 yqffi.dll、libqalculate 经 qalcffi.dll 运行时加载，
# 见 src/yq_impl.rs 与 src/qalc_impl.rs）
[target.'cfg(windows)'.dependencies]
bc-app = { path = "../../vendor/bc-app" }
openssl-app = { path = "../../vendor/openssl-app" }
putty-telnet = { path = "../../vendor/putty-telnet" }
jq-app = { path = "../../vendor/jq-app" }
# yq/qalc 的 DLL 运行时加载（见 yq_impl.rs / qalc_impl.rs：前者是 Go，
# 后者是 autotools C++，均无 MSVC 链接路径，DLL 动态导入是唯一形态）
libloading = "0.8"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
