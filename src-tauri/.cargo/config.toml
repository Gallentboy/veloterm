# Apple Silicon 本地开发性能优化 + CI 恒定基线。
# 不可用 target-cpu=native：GitHub 的 macOS ARM runner 跑在虚拟机里，LLVM 的
# native 探测在该环境下会丢失 aes/sha2 等默认特性，导致 ring 0.17.14 的
# const 断言（cpu/arm/darwin.rs 的 CAPS_STATIC == MIN_STATIC_FEATURES）在 CI
# 编译期炸掉（本机真机探测齐全不触发——同版本 rustc/ring 本机全绿 CI 失败的
# 根因）。固定 apple-m1 基线不做任何运行时探测，CI/本地行为恒定；相比
# v8.0-a 默认基线保留 crypto/crc 等绝大部分收益（M 系芯片全覆盖）。
# rusty_v8（JS 脚本运行时，crate 名 v8）静态库零下载：构建期不从 GitHub
# Releases 下载，一律取 vendor/rusty_v8/ 内的档案（四平台 release 静态库
# .gz + src_binding 绑定文件，tag v152.2.0）。rusty_v8 的 build.rs 对
# 「目录」形态将目录视为档案与绑定文件的唯一权威来源，不回落上游网络。
# [env] 对 build script 生效（Cargo 手册：应用于 build scripts、rustc、
# cargo run/build）；relative 相对 .cargo 父目录（即本 src-tauri/）解析。
[env]
RUSTY_V8_ARCHIVE = { value = "vendor/rusty_v8", relative = true }

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

# Windows MSVC：静态链接 C 运行时（/MT），产物不依赖目标机的 VC++ Redistributable
# （vcruntime140.dll），干净系统可直接运行；代价是每个 exe 增大约 100-200KB。
# --cap-lints allow 压制全部编译告警：vendor 路径依赖（frawk 等）不像 registry 依赖
# 那样被 cargo 自动压制，缓存重放的告警会刷屏 CI 日志；自有代码的告警在 macOS
# 开发构建中仍然可见，不受影响
# linker=rust-lld：链接器统一 lld-link（rust-lld 即 rustup 随工具链分发的
# lld-link 本体，link.exe 的 drop-in 替代——不需外部 LLVM 安装；与 CC=clang-cl
# 的 LLVM 工具链化配套，链接更快且跨平台行为一致）。/MACHINE 等参数由
# rustc 按 msvc target 自动传
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "--cap-lints", "allow"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "--cap-lints", "allow"]
