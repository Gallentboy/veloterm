[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
# 多 bin 包（主程序 + 11 个 Unix 工具 exe）：tauri dev 内部执行 `cargo run` 无 --bin，
# 必须指定默认运行主程序，否则报 "could not determine which binary to run"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0"
bytes = "1.4"
futures = "0.3"
libc = "0.2"
log = "0.4"
portable-pty = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rfd = "0.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig = { package = "rig-core", version = "0.42.0" }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
russh = { version = "0.63.3", default-features = false, features = [
  "des",
  "dsa",
  "rsa",
  "aws-lc-rs",
] }
russh-sftp = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "full",
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
window-vibrancy = "0.8.1"

# ── uutils/coreutils 源码 vendor 集成（https://github.com/uutils/coreutils，MIT，tag 0.12.0）──
# 命令实现直接取自 vendor/coreutils/src/uu/<name>（path 依赖，workspace 继承
# 解析到 vendor 自己的根清单，uucore 等内部依赖全部走 vendor 内路径，不依赖 crates.io）。
# 分组对齐 uutils 官方 feature：feat_common_core + feat_Tier1（跨平台）/
# feat_require_unix_*（unix 专属）/ feat_os_windows 额外项。
# grep/sed/which 不属于 coreutils（独立 GNU 包），由 src/tools/unix_extras.rs 自研补齐。
# chcon/runcon 依赖 SELinux（uutils feat_require_selinux），不集成。
# grep：uutils/grep 0.2.0 源码 vendor（GNU grep 1:1 语法克隆，MIT），
# uucore 已在 vendor 内指向 coreutils 0.12 共用；正则引擎为 onig（bundled C 编译）。
uu_grep = { path = "vendor/grep" }
# rg：ripgrep 15.2.0 源码 vendor（Unlicense OR MIT），主逻辑抽出为 lib
# （vendor/ripgrep/crates/core/lib.rs 的 ripgrep::rg_main()）内嵌进 coreutils 多呼叫二进制。
ripgrep = { path = "vendor/ripgrep" }
# awk：frawk v0.4.7 源码 vendor（ezrosent/frawk，MIT），Cranelift 纯 Rust JIT。
# default-features 必须关闭：上游默认启用 llvm_backend（LLVM C++）、
# unstable（nightly feature）与 use_jemalloc（C 分配器，Windows 不友好）。
frawk = { path = "vendor/frawk", default-features = false, features = ["allow_avx2"] }
# find / xargs：uutils/findutils 0.10.0 源码 vendor（MIT）。入口
# findutils::find::find_main / xargs::xargs_main（&[&str] 含 argv[0] 约定）；
# uucore 已指向 vendor 0.12，nix 已门控为 unix-only。
findutils = { path = "vendor/findutils" }
# fd：sharkdp/fd v10.5.0 源码 vendor（MIT/Apache），librarify 为
# fd_find::fd_main()（读自身 argv，仅硬链接 argv[0] 模式）。
fd-find = { path = "vendor/fd" }
# diff / cmp / sdiff：uutils/diffutils v0.5.0 源码 vendor（MIT）。
# 入口 diffutilslib::{diff,cmp,sdiff}_main（迭代器首元素为命令名，可注入）。
diffutils = { path = "vendor/diffutils" }
# sed：uutils/sed 0.2.0 源码 vendor（MIT），入口 sed::sed::uumain
# （可注入迭代器；uucore 已指向 vendor 0.12）。
sed = { path = "vendor/sed" }
# sd：chmln/sd v1.1.0 源码 vendor（MIT），入口 sd_cli::sd_main_from
# （可注入迭代器，首元素为程序名）。
sd-cli = { path = "vendor/sd/sd-cli" }
# tar：tar-rs 0.4.46 源码 vendor（MIT/Unlicense，纯库）。CLI 壳（-c/-x/-t/-f/-z/-v/-C）
# 在 src/tools/tar_impl.rs 自研；-z 压缩经 flate2 纯 Rust 后端（miniz_oxide，无 zlib C 依赖）。
tar = { path = "vendor/tar-rs" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# eza / tree：eza v0.23.5 源码 vendor（MIT），入口 eza::eza_main_from（可注入；
# tree 命令 = eza --tree）。git 集成经 git2 vendored libgit2（cc 现场编译，需 C 编译器）。
eza = { path = "vendor/eza" }
# palette 0.7.5 的源码与新版 palette_derive 宏不兼容（eza 上游因此钉 =0.7.5；
# 本工程的 lockfile 需同步钉住 derive 版本，否则 cargo 会解析到更新的 0.7.x）
palette_derive = "=0.7.5"
# wget：wget-rs 0.1.0 源码 vendor，入口 wget_rs::wget_main_from（可注入）。
# reqwest 已在 vendor 内改为 rustls-tls 纯 Rust（无 OpenSSL 系统依赖）。
wget-rs = { path = "vendor/wget-rs" }
# uucore 开 openssl feature：md5/sha1/sha2 系 checksum 切换到 libcrypto 后端
# （全平台统一 aws-lc，与 russh 的 aws-lc-rs 同源共享构建链路；feature 统一化
# 令所有 uu_* sum 工具全局生效，纯 Rust 实现保留为 FIPS 拒算法时的运行时兜底）
uucore = { path = "vendor/coreutils/src/uucore", features = ["openssl"] }
uu_arch = { path = "vendor/coreutils/src/uu/arch" }
uu_b2sum = { path = "vendor/coreutils/src/uu/b2sum" }
uu_base32 = { path = "vendor/coreutils/src/uu/base32" }
uu_base64 = { path = "vendor/coreutils/src/uu/base64" }
uu_basename = { path = "vendor/coreutils/src/uu/basename" }
uu_basenc = { path = "vendor/coreutils/src/uu/basenc" }
uu_cat = { path = "vendor/coreutils/src/uu/cat" }
uu_cksum = { path = "vendor/coreutils/src/uu/cksum" }
uu_comm = { path = "vendor/coreutils/src/uu/comm" }
uu_cp = { path = "vendor/coreutils/src/uu/cp" }
uu_csplit = { path = "vendor/coreutils/src/uu/csplit" }
uu_cut = { path = "vendor/coreutils/src/uu/cut" }
uu_date = { path = "vendor/coreutils/src/uu/date" }
uu_dd = { path = "vendor/coreutils/src/uu/dd" }
uu_df = { path = "vendor/coreutils/src/uu/df" }
uu_dir = { path = "vendor/coreutils/src/uu/dir" }
uu_dircolors = { path = "vendor/coreutils/src/uu/dircolors" }
uu_dirname = { path = "vendor/coreutils/src/uu/dirname" }
uu_du = { path = "vendor/coreutils/src/uu/du" }
uu_echo = { path = "vendor/coreutils/src/uu/echo" }
uu_env = { path = "vendor/coreutils/src/uu/env" }
uu_expand = { path = "vendor/coreutils/src/uu/expand" }
uu_expr = { path = "vendor/coreutils/src/uu/expr" }
uu_factor = { path = "vendor/coreutils/src/uu/factor" }
uu_false = { path = "vendor/coreutils/src/uu/false" }
uu_fmt = { path = "vendor/coreutils/src/uu/fmt" }
uu_fold = { path = "vendor/coreutils/src/uu/fold" }
uu_head = { path = "vendor/coreutils/src/uu/head" }
uu_hostid = { path = "vendor/coreutils/src/uu/hostid" }
uu_hostname = { path = "vendor/coreutils/src/uu/hostname" }
uu_join = { path = "vendor/coreutils/src/uu/join" }
uu_kill = { path = "vendor/coreutils/src/uu/kill" }
uu_link = { path = "vendor/coreutils/src/uu/link" }
uu_ln = { path = "vendor/coreutils/src/uu/ln" }
uu_ls = { path = "vendor/coreutils/src/uu/ls" }
uu_md5sum = { path = "vendor/coreutils/src/uu/md5sum" }
uu_mkdir = { path = "vendor/coreutils/src/uu/mkdir" }
uu_mktemp = { path = "vendor/coreutils/src/uu/mktemp" }
uu_more = { path = "vendor/coreutils/src/uu/more" }
uu_mv = { path = "vendor/coreutils/src/uu/mv" }
uu_nl = { path = "vendor/coreutils/src/uu/nl" }
uu_nice = { path = "vendor/coreutils/src/uu/nice" }
uu_nohup = { path = "vendor/coreutils/src/uu/nohup" }
uu_nproc = { path = "vendor/coreutils/src/uu/nproc" }
uu_numfmt = { path = "vendor/coreutils/src/uu/numfmt" }
uu_od = { path = "vendor/coreutils/src/uu/od" }
uu_paste = { path = "vendor/coreutils/src/uu/paste" }
uu_pathchk = { path = "vendor/coreutils/src/uu/pathchk" }
uu_pr = { path = "vendor/coreutils/src/uu/pr" }
uu_printenv = { path = "vendor/coreutils/src/uu/printenv" }
uu_printf = { path = "vendor/coreutils/src/uu/printf" }
uu_ptx = { path = "vendor/coreutils/src/uu/ptx" }
uu_pwd = { path = "vendor/coreutils/src/uu/pwd" }
uu_readlink = { path = "vendor/coreutils/src/uu/readlink" }
uu_realpath = { path = "vendor/coreutils/src/uu/realpath" }
uu_rm = { path = "vendor/coreutils/src/uu/rm" }
uu_rmdir = { path = "vendor/coreutils/src/uu/rmdir" }
uu_seq = { path = "vendor/coreutils/src/uu/seq" }
uu_sha1sum = { path = "vendor/coreutils/src/uu/sha1sum" }
uu_sha224sum = { path = "vendor/coreutils/src/uu/sha224sum" }
uu_sha256sum = { path = "vendor/coreutils/src/uu/sha256sum" }
uu_sha384sum = { path = "vendor/coreutils/src/uu/sha384sum" }
uu_sha512sum = { path = "vendor/coreutils/src/uu/sha512sum" }
uu_shred = { path = "vendor/coreutils/src/uu/shred" }
uu_shuf = { path = "vendor/coreutils/src/uu/shuf" }
uu_sleep = { path = "vendor/coreutils/src/uu/sleep" }
uu_sort = { path = "vendor/coreutils/src/uu/sort" }
uu_split = { path = "vendor/coreutils/src/uu/split" }
uu_sum = { path = "vendor/coreutils/src/uu/sum" }
uu_sync = { path = "vendor/coreutils/src/uu/sync" }
uu_tac = { path = "vendor/coreutils/src/uu/tac" }
