[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0"
bytes = "1.4"
futures = "0.3"
libc = "0.2"
log = "0.4"
portable-pty = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig = { package = "rig-core", version = "0.42.0" }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
russh = { version = "0.63.3", default-features = false, features = [
  "des",
  "dsa",
  "rsa",
  "aws-lc-rs",
] }
russh-sftp = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "full",
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
window-vibrancy = "0.8.1"

[dev-dependencies]
# 传输层单测依赖 tokio paused-clock（start_paused / advance）
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
panic = "deny"
indexing_slicing = "deny"

[build]
rustflags = ["-C", "target-cpu=native"]

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
