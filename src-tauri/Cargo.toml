[workspace]
# 本目录既是主程序包（app）也是工作区根。
#
# 内置工具集已拆为独立 member：命令名清单（零依赖）与多呼叫二进制各一个 crate。
# 主程序不再依赖 uutils / ripgrep / findutils / openssl-app / putty-telnet 的
# 任何一项 —— 这些只进入 coreutils 多呼叫二进制，于是
#   · app 二进制不再被 OpenSSL/PuTTY/uutils 代码与静态库撑大；
#   · 改 UI/Tauri IPC 只重链 app，改工具只重链 coreutils，Fat LTO 不再互相牵连。
#
# 默认成员 = 根包（app），故 `cargo build` / `cargo test` 只作用于主程序；
# 工具集需显式 `cargo build -p coreutils`（打包脚本 scripts/build-tools.mjs 已如此调用）。
members = ["crates/tools-catalog", "crates/coreutils"]
# vendor 下的源码树各自独立：coreutils/sed/ripgrep/sd 自带 [workspace]（uu_*
# 经 workspace 继承取值），findutils/grep/fd 等是无继承键的独立清单。若不
# exclude，Cargo 会把 vendor 里的包划入本工作区，uucore 的
# `edition.workspace = true` 便会错误地朝本清单（无 [workspace.package]）
# 取值而报「workspace.package.edition was not defined」。
exclude = ["vendor"]
# edition 2024 对应 resolver 3（显式写出，避免与根包默认值隐式耦合）
resolver = "3"

[package]
name = "app"
version = "1.0.8"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
# tauri dev 内部执行 `cargo run` 不带 --bin，显式钉住主程序 bin 以免歧义
# （coreutils 多呼叫二进制已移出本包，见上方 [workspace]）
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# 内置工具集的命令名清单（零依赖 crate）：启动时据此在 tools/ 下创建硬链接
# 短名入口。命令实现不在本 crate —— 见 crates/coreutils，主程序刻意不依赖它。
tools-catalog = { path = "crates/tools-catalog" }

anyhow = "1.0"
bytes = "1.4"
# 命令库 .vtcmd 二进制容器的 deflate 压缩（纯 Rust 后端，与 coreutils 声明一致）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
libc = "0.2"
log = "0.4"
portable-pty = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rfd = "0.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig = { package = "rig-core", version = "0.42.0" }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
# ZMODEM 协议引擎（终端内 sz/rz 收发；vendor 子集 + 本地修补/增补清单见
# vendor/rzsz/README.md）
rzsz = { path = "vendor/rzsz" }
# GIF→MP4 转码（ffmpeg 树内库 libgif2mp4 的静态绑定；.a 族预编译好后由
# 其 build.rs 接线，构建指引见 vendor/ffmpeg/libgif2mp4/README.md；
# ⚠️ x264+--enable-gpl ⇒ 该库按 GPL 分发，随包商用前需项目方确认）
gif2mp4-sys = { path = "vendor/gif2mp4-sys" }
russh = { version = "0.63.3", default-features = false, features = [
  "des",
  "dsa",
  "rsa",
  "aws-lc-rs",
] }
russh-sftp = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 命令库 .vtcmd 二进制容器的 SHA-256 尾部校验
sha2 = "0.10"
# protocol-asset：PDF 预览经 convertFileSrc 把临时 PNG 转为 asset:// URL
tauri = { version = "2.12.3", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "full",
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }
window-vibrancy = "0.8.1"
fast-socks5 = "1.0.0"

# SSH 中继（veloterm_relay）客户端接入：proto 是线缆协议/鉴权单一实现
# （服务端与客户端共用，见 relay/ 独立 workspace），传输库与 relay crate 同版本。
# quinn/rustls 走 aws-lc-rs，与既有 russh 的 aws-lc-sys 构建复用同一份。
veloterm-relay-proto = { path = "../relay/crates/veloterm-relay-proto" }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"] }
futures-util = "0.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# ZooKeeper 客户端（纯 Rust/tokio，支持 ACL 与认证）；sha1+base64 计算 digest scheme id
zookeeper-client = "0.2"
sha1 = "0.10"
base64 = "0.22"
# gRPC 客户端（tonic + prost-reflect 动态消息）：服务器反射取 schema，
# JSON ↔ protobuf 动态编解码做一元调用；tls-aws-lc 与 quinn/russh 同 provider
# （rustls 双 provider feature 并存会让运行期无法选定默认 CryptoProvider 而 panic）
tonic = { version = "0.13", features = ["tls-aws-lc", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.15", features = ["serde"] }
http = "1"
# Excel 表格预览（xlsx/xls/xlsb/ods）：calamine 纯 Rust 解析引擎（零外部 C 依赖）
calamine = "0.37"
# bash/shell 脚本分析（Monaco shell 补全的后端半边）：tree-sitter-bash 官方语法
# crate，parser.c/scanner.cc 构建期 cc 静态编译进二进制（macOS/Windows 全平台
# 免配置、零动态库；版本与 tree-sitter core 锁同一 0.25 配对，升级同步 bump）
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
# X.509 证书与 SSL 解析器（.crt/.pem/.cer）：纯 Rust RFC 5280 解析器
x509-parser = "0.18"
# PDF 预览 + 图片转码：PDFium（Chromium 同款 C++ 渲染引擎）经 pdfium-render 绑定。
# image 启用全部纯 Rust 解码格式（png/jpeg/gif/webp/bmp/ico/tiff/tga/dds/hdr/
# exr/pnm/qoi/farbfeld/avif），用于「浏览器不原生支持的图片格式」后端转 PNG。
# 不支持的（heic/heif 需 libheif、raw 需 libraw、jxl 需 libjxl、jp2 需 openjpeg）
# 会在错误信息里明确说明。
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tiff",
  "tga",
  "dds",
  "hdr",
  "exr",
  "pnm",
  "qoi",
  "ff",
  "avif",
] }
once_cell = "1"
# JPEG XL 解码（jxl 格式）：**树内 vendor 的运行期加载分支**。
# 不启用 `image` feature——它要求 image ^0.25,<0.25.9，与本项目（及
# onefetch）锁定的 0.25.10 冲突；直接用 jpegxl-rs 的像素解码 API 取 RGBA
# 缓冲，再用 image 0.25 编码 PNG（见 pdf.rs 的 jxl 分支）。
# 上游 crates.io 版是链接期动态链接（pkg-config 找不到 libjxl 时 build
# script 直接 panic，且进程启动即硬依赖库文件），树内修补版改为 pdfium
# 同型的运行期加载：pdf.rs 先按候选路径调 jpegxl_sys::bind_to_library，
# 再走 jpegxl-rs 的解码 API。修补清单见 vendor/jpegxl-sys/README.md。
jpegxl-rs = { path = "vendor/jpegxl-rs", default-features = false }
jpegxl-sys = { path = "vendor/jpegxl-sys" }
# 终端录制导出 GIF：agg（asciinema 官方 GIF 生成器，纯 Rust）vendor 树的 lib
# 目标，`agg::run(cast输入, 文件输出, Config)`。上游未发布 crates.io 库形态故
# vendor（tag v1.9.0，零代码补丁，树体裁剪与许可注意见 vendor/agg/README.md：
# 上游 GPL-3.0 + gifski AGPL-3.0，商用发布前需项目方确认，同 libjxl 先例）。
# 字体：树内自带 NotoEmoji/SymbolsNerdFont + fontdb 系统字体扫描，CJK 走
# 配置传入的系统字体回退链（PingFang/微软雅黑等），无需打包 CJK 字体。
agg = { path = "vendor/agg" }
# Oracle 引擎：kubo/rust-oracle（oracle crate，官方 ODPI-C 绑定）vendor 树
#（锁 tag v0.6.3），UPL-1.0/Apache-2.0 双许可。ODPI-C 经 crates.io 的
# odpic-sys 在编译期 cc 静态编入（无需 Oracle SDK），运行期需 Instant
# Client（11.2–23ai 全版本）。同步 API——engines.rs 经 with_oracle
# （spawn_blocking）包裹。前一方案 stiang/oracle-rs（纯 Rust TNS）在 11.2
# 实测不可用已移除。裁剪与说明见 vendor/rust-oracle/README-VELOTERM.md。
oracle = { path = "vendor/rust-oracle", features = ["chrono"] }
# OceanBase Oracle 模式引擎：libobclient（OceanBase Connector/C）的手写 FFI
# sys crate，vendor 树 path 依赖（gif2mp4-sys 同先例——库本体由
# vendor/obconnector-c 预编译、静态档案在 vendor/obclient-lib/，build.rs
# 只做档案校验与链接旗标、不编译任何 C 代码）。安全包装（spawn_blocking
# 适配、行流、错误转 String）在 src/db_browser/obclient.rs。
obclnt-sys = { path = "vendor/obclnt-sys" }
# 达梦 DM8 引擎：dm-pure（纯 Rust 自实现 DM 网络协议）vendor 树，MIT。
# 零外部数据库依赖（无需达梦 Instant Client / libdmdpi），8 个纯 Rust 依赖、
# 无构建脚本、无 tokio（同步 std::net，engines.rs 经 spawn_blocking 包裹）。
# 上游仓库入库时已 404，故整树 vendor 以便自主打补丁；补丁台账与升级流程见
# vendor/dm-pure/README-veloterm.md。驱动不感知兼容模式（Oracle/MySQL 由
# 服务器 dm.ini 决定），对象树统一走 Oracle 风格数据字典。
dm-pure = { path = "vendor/dm-pure" }
# ── 数据库工作台（MySQL / PostgreSQL / Oracle / OceanBase / 达梦 DM8 / SQLite）──
# mysql_async：纯 Rust 异步 MySQL 客户端。default-rustls = rustls + aws-lc-rs
# provider（与 quinn/tonic/russh 同一份 aws-lc-sys，禁止 default 的 native-tls
# ——rustls 双 provider 并存会运行期 panic，见上方 rustls 条目约束）。
mysql_async = { version = "0.35", default-features = false, features = [
  "default-rustls",
] }
# tokio-postgres：纯 Rust 异步 PostgreSQL 客户端（extended protocol，query_raw
# 逐行流式拉取）；with-* 类型扩展让 jsonb/numeric/uuid/timestamp 列都能取值
# 字符串化（工作台结果表格的通用降级取值链）。
tokio-postgres = { version = "0.7", features = [
  "with-serde_json-1",
  "with-chrono-0_4",
  "with-uuid-0_8",
] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
# verify-full 模式的系统根证书（tonic tls-native-roots 已拉过同 crate，直依赖复用）
rustls-native-certs = "0.8"
rust_decimal = { version = "1", default-features = false, features = [
  "std",
  "db-tokio-postgres",
] }
# tokio-postgres 的 uuid 集成锁 0.8（工程主 uuid 为 1.x，仅用于 id 生成）；
# rename 为 pg_uuid 与主依赖同名共存，PG uuid 列取值专用
pg-uuid = { package = "uuid", version = "0.8" }
# PostgreSQL 的 rustls MakeConnector（provider 由全局 rustls/aws-lc-rs 决定）
tokio-postgres-rustls = "0.14"
# redis：纯 Rust 异步 Redis 客户端（RESP2/RESP3）。tokio-comp = tokio 异步连接；
# tokio-rustls-comp = tokio 流上的 rustls 传输（它已含 tls-rustls；只开 tls-rustls
# 时 Tokio 运行时缺 connect_tcp_tls 实现，redis 自身编译不过——E0046 实测踩过）。
# rustls 与工程同一份 0.23，provider 由全局 aws-lc-rs 决定——严禁启用 native-tls
# 或 ring 变体，双 provider 会运行期 panic。
# tls-rustls-insecure 不可省：prefer/require 档要求「加密但接受任意证书」，
# redis-rs 的 ConnectionAddr::TcpTls{insecure:true} 在缺该 feature 时直接运行期
# 报错（见 engines.rs 的 connect_redis）；verify-full 走系统根证书。
redis = { version = "1.7.1", default-features = false, features = [
  "tokio-comp",
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "streams",
] }
# SQL 语句分割 + 只读白名单判定（数据库工作台的多语句执行与写防护）。
# 解析失败时降级到手写分号分割器（字符串/注释内的分号不算），sqlparser
# 只是增强路径而非硬依赖路径（方言特有语法不该把工作台卡死）。
sqlparser = "0.53"

# **PDFium 链接形态按平台分流**：
# - macOS Apple Silicon（aarch64）：**静态链接** vendor/pdfium/libpdfium.a
#   （含 Chromium 自编 libcxx.a/libcxxabi.a，__Cr namespace 与系统 C++ 库
#   互不兼容，必须一起链）。静态化的收益是免去 dylib 的代码签名要求
#   （macOS ARM64 会拒绝加载未签名/仅 linker-signed 的第三方 dylib）。
# - 其他平台（Windows 全架构、macOS Intel）：**动态加载**对应 dylib/dll，
#   运行期按路径 dlopen（见 pdf.rs）。
#
# pdfium-render 的 `static` feature 是编译期全局开关（启用后
# bind_to_library 动态 API 直接不存在），因此用 target-specific 依赖实现：
# 同一份源码在不同目标上编出不同的绑定形态。
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
pdfium-render = { version = "0.9", features = ["static"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
pdfium-render = "0.9"

# ── 已迁出的依赖 ──
# 全部内置命令行工具（uutils/coreutils 全集 + grep/sed/findutils/diffutils/
# ripgrep/fd/sd/frawk/eza/wget/tar，以及 Windows 专属的 openssl-app 与
# putty-telnet）连同 crossterm / sysinfo 一起，现由 crates/coreutils 声明。
# 本包保持零工具依赖，是「主程序瘦身」与「增量构建互不牵连」的前提。

[dev-dependencies]
# 传输层单测依赖 tokio paused-clock（start_paused / advance）
tokio = { version = "1", features = ["test-util"] }
# relay_dial 集成测试：起真实中继验证 app 侧 dial_relay 握手与字节管道
veloterm-relay = { path = "../relay/crates/veloterm-relay" }
# grpc_call 回环测试：自签证书（TLS 车道；FileDescriptorProto 构造在主依赖 prost-types）
rcgen = "0.13"
http-body-util = "0.1"

[lints.clippy]
panic = "deny"
indexing_slicing = "deny"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
