uu_tsort = { path = "vendor/coreutils/src/uu/tsort" }
uu_tty = { path = "vendor/coreutils/src/uu/tty" }
uu_uname = { path = "vendor/coreutils/src/uu/uname" }
uu_unexpand = { path = "vendor/coreutils/src/uu/unexpand" }
uu_uniq = { path = "vendor/coreutils/src/uu/uniq" }
uu_unlink = { path = "vendor/coreutils/src/uu/unlink" }
uu_uptime = { path = "vendor/coreutils/src/uu/uptime" }
uu_vdir = { path = "vendor/coreutils/src/uu/vdir" }
uu_wc = { path = "vendor/coreutils/src/uu/wc" }
uu_whoami = { path = "vendor/coreutils/src/uu/whoami" }
uu_yes = { path = "vendor/coreutils/src/uu/yes" }

# unix 专属命令（uutils feat_require_unix_core + feat_require_unix_utmpx）
[target.'cfg(unix)'.dependencies]
uu_chgrp = { path = "vendor/coreutils/src/uu/chgrp" }
uu_chmod = { path = "vendor/coreutils/src/uu/chmod" }
uu_chown = { path = "vendor/coreutils/src/uu/chown" }
uu_chroot = { path = "vendor/coreutils/src/uu/chroot" }
uu_groups = { path = "vendor/coreutils/src/uu/groups" }
uu_id = { path = "vendor/coreutils/src/uu/id" }
uu_install = { path = "vendor/coreutils/src/uu/install" }
uu_logname = { path = "vendor/coreutils/src/uu/logname" }
uu_mkfifo = { path = "vendor/coreutils/src/uu/mkfifo" }
uu_mknod = { path = "vendor/coreutils/src/uu/mknod" }
uu_stat = { path = "vendor/coreutils/src/uu/stat" }
uu_stty = { path = "vendor/coreutils/src/uu/stty" }
uu_pinky = { path = "vendor/coreutils/src/uu/pinky" }
uu_users = { path = "vendor/coreutils/src/uu/users" }
uu_who = { path = "vendor/coreutils/src/uu/who" }

# stdbuf：unix 与 windows 均可用（uutils feat_os_windows 额外项 / feat_require_unix）
[target.'cfg(any(unix, windows))'.dependencies]
uu_stdbuf = { path = "vendor/coreutils/src/uu/stdbuf" }

# openssl CLI（仅 Windows）：vcpkg x64-windows-static 静态库（与 SQLCipher 共用同一份）
# + 现场编译的 apps/openssl.c（-Dmain 改名 FFI）。入口 openssl_app::openssl_cmd_main，
# 迭代器首元素为程序名 "openssl"。源码为工程内锁版本 vendor/openssl-src（3.6.4，
# 与 vcpkg 实装 openssl:x64-windows-static@3.6.4#1 严格一致，CI 校验防漂移）；
# vcpkg 端口默认 no-apps，progs.c 由 build.rs 以 shim + progs.pl 生成。
[target.'cfg(windows)'.dependencies]
openssl-app = { path = "vendor/openssl-app" }

[dev-dependencies]
# 传输层单测依赖 tokio paused-clock（start_paused / advance）
tokio = { version = "1", features = ["test-util"] }

# ── 内置 Unix 工具集：单一 coreutils 多呼叫二进制（BusyBox 模式）──
# 安装时以 NTFS hardlink 生成 ls.exe/grep.exe/... 等短名入口（见 src/tools/hardlinks.rs），
# PATH 注入 tools 目录后用户直接敲短名即用；无任何 .bat 转发。
[[bin]]
name = "coreutils"
path = "src/tools/coreutils_main.rs"

[lints.clippy]
panic = "deny"
indexing_slicing = "deny"


[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
