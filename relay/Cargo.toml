[workspace]
# veloterm 中继子工程：独立于 src-tauri 主 workspace（app 依赖图不进中继二进制）。
# crates/veloterm-relay-proto 是线缆协议与鉴权的单一实现，服务端（veloterm-relay）
# 与主程序客户端（src-tauri 以 path 依赖仅引用 proto，不引 relay bin）共用。
resolver = "3"
members = ["crates/veloterm-relay-proto", "crates/veloterm-relay"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"

# 与主工程（src-tauri）profile.release 同参：fat LTO + 单 codegen 单元 +
# 符号剥离 + abort on panic（服务端二进制同受益：体积更小、全程序优化）
[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
